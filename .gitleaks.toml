# Extends the default rules. The allowlist covers fixtures that the
# generic-api-key rule flags. These values are not credentials.
[extend]
useDefault = true

[allowlist]
description = "Test and CI secret fixtures"
regexes = [
  '''test-key-encryption-secret-at-least-32-chars-long''',
  '''ci-jwt-key-encryption-secret-0123456789abcd''',
  # Webhook signature test key: a fixed throwaway key so the verifier test can sign its own messages.
  '''0123456789abcdef0123456789abcdef''',
  '''whsec_MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=''',
]
